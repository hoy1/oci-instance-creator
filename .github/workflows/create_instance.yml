name: OCI Auto Instance Creator

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  create-oci-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI & Launch Instance with Retries
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER_ID
          fingerprint=$OCI_FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_ID
          region=$OCI_REGION
          EOF

          chmod 600 ~/.oci/config
          echo "$SSH_KEY" > ssh_key.pub

          IMAGE_ID=$(/home/runner/bin/oci compute image list \
            --compartment-id "$OCI_TENANCY_ID" \
            --shape "VM.Standard.A1.Flex" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --sort-by TIMECREATED \
            --sort-order DESC \
            --query "data[0].id" \
            --raw-output)

          echo "검색된 Image ID: $IMAGE_ID"

          # 30초 간격으로 최대 10번 재시도
          for i in {1..10}; do
            echo "==== [$i/10] OCI 인스턴스 생성 시도 중... ===="
            
            set +e
            OUTPUT=$(/home/runner/bin/oci compute instance launch \
              --compartment-id "$OCI_TENANCY_ID" \
              --availability-domain "$OCI_AVAILABILITY_DOMAIN" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 4, "memory_in_gbs": 24}' \
              --subnet-id "$OCI_SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --assign-public-ip true \
              --ssh-authorized-keys-file ssh_key.pub \
              --display-name "Auto-Created-A1-Flex" 2>&1)
            set -e

            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q "PROVISIONING"; then
              echo "🎉 인스턴스 생성 성공!"
              exit 0
            fi

            echo "재고 부족 또는 대기 중... 30초 후 재시도합니다."
            sleep 30
          done

          exit 1
